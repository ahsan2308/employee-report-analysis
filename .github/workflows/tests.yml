name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit, golden and contract tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y unixodbc
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (unused imports, undefined names)
        run: ruff check .
      - name: Run tests (integration tests skip without a database)
        run: python -m pytest

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      # Every package is pinned, so audit the pins as written instead of
      # resolving them again; any known vulnerability fails the job.
      - name: Audit pinned requirements
        run: pip-audit -r requirements.txt -r requirements-dev.txt --no-deps --disable-pip --progress-spinner off

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myuser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://myuser:mypassword@localhost:5432/erp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y unixodbc
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run integration tests
        run: python -m pytest tests/integration

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t employee-report-analysis .
      - name: Smoke-test image
        run: |
          docker run --rm employee-report-analysis python -c "import pyodbc; drivers = pyodbc.drivers(); print(drivers); assert 'ODBC Driver 17 for SQL Server' in drivers"
          docker run --rm employee-report-analysis python -c "import app.worker.worker"
