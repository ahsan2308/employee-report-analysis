# Weekly version updates. Minor and patch bumps are grouped into one PR per
# ecosystem; major bumps arrive one PR each. Security updates are separate
# and arrive as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
