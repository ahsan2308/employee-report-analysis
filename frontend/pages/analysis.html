<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis - Employee Evaluation System</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/analysis.css">
    <link rel="stylesheet" href="../css/metric-indicators.css">
    <link rel="stylesheet" href="../css/quarterly-components.css">
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-brain"></i> Employee Evaluation System</h1>
            <nav>
                <ul>
                    <li><a href="../index.html"><i class="fas fa-home"></i> Home</a></li>
                    <li><a href="employees.html"><i class="fas fa-users"></i> Employees</a></li>
                    <li><a href="reports.html"><i class="fas fa-file-alt"></i> Reports</a></li>
                    <li><a href="imports.html"><i class="fas fa-file-import"></i> Imports</a></li>
                    <li><a href="analysis.html" class="active"><i class="fas fa-brain"></i> Analysis</a></li>
                    <li><a href="visualizations.html"><i class="fas fa-chart-bar"></i> Visualizations</a></li>
                    <li><a href="sync.html"><i class="fas fa-sync-alt"></i> Sync</a></li>
                </ul>
            </nav>
        </header>
        
        <main>
            <section class="selection-panel card">
                <h2><i class="fas fa-chart-pie"></i> Performance Analysis</h2>
                <div id="statusMessage" style="display: none;"></div>
                
                <!-- Add analysis mode toggle -->
                <div class="analysis-mode-toggle">
                    <span>Analysis Mode:</span>
                    <div class="toggle-container">
                        <input type="radio" id="weeklyToggle" name="analysisMode" value="weekly" checked>
                        <label for="weeklyToggle">Weekly</label>
                        <input type="radio" id="monthlyToggle" name="analysisMode" value="monthly">
                        <label for="monthlyToggle">Monthly</label>
                        <input type="radio" id="quarterlyToggle" name="analysisMode" value="quarterly">
                        <label for="quarterlyToggle">Quarterly</label>
                    </div>
                </div>
                
                <div class="analysis-controls">
                    <div class="form-group">
                        <label for="employeeSelect"><i class="fas fa-user"></i> Select Employee:</label>
                        <select id="employeeSelect" class="form-control">
                            <option value="">-- Select Employee --</option>
                        </select>
                    </div>
                    
                    <!-- Weekly report selection (default) -->
                    <div class="form-group" id="reportSelectGroup">
                        <label for="reportSelect"><i class="fas fa-file-alt"></i> Select Report:</label>
                        <select id="reportSelect" class="form-control">
                            <option value="">-- First Select Employee --</option>
                        </select>
                    </div>
                    
                    <!-- Monthly analysis period selection (initially hidden) -->
                    <div class="form-group monthly-control" id="monthSelectGroup" style="display: none;">
                        <label for="monthSelect"><i class="fas fa-calendar-alt"></i> Select Month:</label>
                        <select id="monthSelect" class="form-control">
                            <option value="1">January</option>
                            <option value="2">February</option>
                            <option value="3">March</option>
                            <option value="4">April</option>
                            <option value="5">May</option>
                            <option value="6">June</option>
                            <option value="7">July</option>
                            <option value="8">August</option>
                            <option value="9">September</option>
                            <option value="10">October</option>
                            <option value="11">November</option>
                            <option value="12">December</option>
                        </select>
                    </div>
                    
                    <div class="form-group monthly-control" id="yearSelectGroup" style="display: none;">
                        <label for="yearSelect"><i class="fas fa-calendar-year"></i> Select Year:</label>
                        <select id="yearSelect" class="form-control">
                            <!-- Years will be populated dynamically -->
                        </select>
                    </div>
                    
                    <!-- Quarter selection for quarterly analysis (initially hidden) -->
                    <div class="form-group quarterly-control" id="quarterSelectGroup" style="display: none;">
                        <label for="quarterSelect"><i class="fas fa-calendar-alt"></i> Select Quarter:</label>
                        <select id="quarterSelect" class="form-control">
                            <option value="1">Q1 (Jan-Mar)</option>
                            <option value="2">Q2 (Apr-Jun)</option>
                            <option value="3">Q3 (Jul-Sep)</option>
                            <option value="4">Q4 (Oct-Dec)</option>
                        </select>
                    </div>
                    
                    <button id="analyzeButton" class="button primary-button" disabled><i class="fas fa-cogs"></i> Analyze Report</button>
                </div>
                
                <div id="loadingIndicator" class="loading" style="display: none;">
                    <div class="spinner"></div>
                    <p>Analyzing... This may take a moment.</p>
                </div>
            </section>
            
            <section id="analysisResults" class="card" style="display: none;">
                <!-- Analysis results will be dynamically inserted here -->
            </section>
        </main>
        
        <footer>
            <p>&copy; 2025 Employee Evaluation System</p>
        </footer>
    </div>
    
    <script src="../js/api.js"></script>
    <script src="../js/dropdown.js"></script>
    <script src="../js/analysis.js"></script>
    <script src="../js/quarterly-analysis.js"></script>
</body>
</html>
