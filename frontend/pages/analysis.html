<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis - Employee Evaluation System</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/analysis.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Employee Evaluation System</h1>
            <nav>
                <ul>
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="employees.html">Employees</a></li>
                    <li><a href="reports.html">Reports</a></li>
                    <li><a href="analysis.html" class="active">Analysis</a></li>
                </ul>
            </nav>
        </header>
        
        <main>
            <section class="selection-panel">
                <h2>Report Analysis</h2>
                <div id="statusMessage" style="display: none;"></div>
                
                <div class="analysis-controls">
                    <div class="form-group">
                        <label for="employeeSelect">Select Employee:</label>
                        <select id="employeeSelect" class="form-control">
                            <option value="">-- Select Employee --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="reportSelect">Select Report:</label>
                        <select id="reportSelect" class="form-control">
                            <option value="">-- First Select Employee --</option>
                        </select>
                    </div>
                    <button id="analyzeButton" class="button primary-button" disabled>Analyze Report</button>
                </div>
                
                <div id="loadingIndicator" class="loading" style="display: none;">
                    <div class="spinner"></div>
                    <p>Analyzing report... This may take a moment.</p>
                </div>
            </section>
            
            <section id="analysisResults" style="display: none;">
                <!-- Analysis results will be dynamically inserted here -->
            </section>
        </main>
        
        <footer>
            <p>&copy; 2025 Employee Evaluation System</p>
        </footer>
    </div>
    
    <script src="../js/api.js"></script>
    <script src="../js/analysis.js"></script>
</body>
</html>
