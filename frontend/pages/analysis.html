<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis - Employee Evaluation System</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/analysis.css">
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-brain"></i> Employee Evaluation System</h1>
            <nav>
                <ul>
                    <li><a href="../index.html"><i class="fas fa-home"></i> Home</a></li>
                    <li><a href="employees.html"><i class="fas fa-users"></i> Employees</a></li>
                    <li><a href="reports.html"><i class="fas fa-file-alt"></i> Reports</a></li>
                    <li><a href="imports.html"><i class="fas fa-file-import"></i> Imports</a></li>
                    <li><a href="analysis.html" class="active"><i class="fas fa-brain"></i> Analysis</a></li>
                    <li><a href="visualizations.html"><i class="fas fa-chart-bar"></i> Visualizations</a></li>
                </ul>
            </nav>
        </header>
        
        <main>
            <section class="selection-panel card">
                <h2><i class="fas fa-chart-pie"></i> Report Analysis</h2>
                <div id="statusMessage" style="display: none;"></div>
                
                <!-- Add analysis type toggle switch -->
                <div class="analysis-type-toggle">
                    <div class="toggle-container">
                        <input type="radio" id="weeklyToggle" name="analysisType" value="weekly" checked>
                        <label for="weeklyToggle">Weekly Analysis</label>
                        <input type="radio" id="monthlyToggle" name="analysisType" value="monthly">
                        <label for="monthlyToggle">Monthly Analysis</label>
                    </div>
                </div>
                
                <div class="analysis-controls">
                    <div class="form-group">
                        <label for="employeeSelect"><i class="fas fa-user"></i> Select Employee:</label>
                        <select id="employeeSelect" class="form-control">
                            <option value="">-- Select Employee --</option>
                        </select>
                    </div>
                    
                    <!-- Weekly selection (default visible) -->
                    <div class="form-group weekly-controls">
                        <label for="reportSelect"><i class="fas fa-file-alt"></i> Select Report:</label>
                        <select id="reportSelect" class="form-control">
                            <option value="">-- First Select Employee --</option>
                        </select>
                    </div>
                    
                    <!-- Monthly selection (initially hidden) -->
                    <div class="form-group monthly-controls" style="display: none;">
                        <div class="date-selectors">
                            <div class="month-selector">
                                <label for="monthSelect"><i class="fas fa-calendar-alt"></i> Month:</label>
                                <select id="monthSelect" class="form-control">
                                    <option value="1">January</option>
                                    <option value="2">February</option>
                                    <option value="3">March</option>
                                    <option value="4">April</option>
                                    <option value="5">May</option>
                                    <option value="6">June</option>
                                    <option value="7">July</option>
                                    <option value="8">August</option>
                                    <option value="9">September</option>
                                    <option value="10">October</option>
                                    <option value="11">November</option>
                                    <option value="12">December</option>
                                </select>
                            </div>
                            <div class="year-selector">
                                <label for="yearSelect"><i class="fas fa-calendar-day"></i> Year:</label>
                                <select id="yearSelect" class="form-control">
                                    <!-- Will be populated with JS -->
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <button id="analyzeButton" class="button primary-button" disabled data-weekly-text="Analyze Report" data-monthly-text="Analyze Monthly Performance"><i class="fas fa-cogs"></i> Analyze Report</button>
                </div>
                
                <div id="loadingIndicator" class="loading" style="display: none;">
                    <div class="spinner"></div>
                    <p>Analyzing report... This may take a moment.</p>
                </div>
            </section>
            
            <section id="analysisResults" class="card" style="display: none;">
                <!-- Analysis results will be dynamically inserted here -->
            </section>
        </main>
        
        <footer>
            <p>&copy; 2025 Employee Evaluation System</p>
        </footer>
    </div>
    
    <script src="../js/api.js"></script>
    <script src="../js/dropdown.js"></script>  <!-- Changed from searchable-dropdown.js -->
    <script src="../js/analysis.js"></script>
</body>
</html>
