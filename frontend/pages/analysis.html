<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis - Employee Evaluation System</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/analysis.css">
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-brain"></i> Employee Evaluation System</h1>
            <nav>
                <ul>
                    <li><a href="../index.html"><i class="fas fa-home"></i> Home</a></li>
                    <li><a href="employees.html"><i class="fas fa-users"></i> Employees</a></li>
                    <li><a href="reports.html"><i class="fas fa-file-alt"></i> Reports</a></li>
                    <li><a href="imports.html"><i class="fas fa-file-import"></i> Imports</a></li>
                    <li><a href="analysis.html" class="active"><i class="fas fa-brain"></i> Analysis</a></li>
                    <li><a href="visualizations.html"><i class="fas fa-chart-bar"></i> Visualizations</a></li>
                </ul>
            </nav>
        </header>
        
        <main>
            <section class="selection-panel card">
                <h2><i class="fas fa-chart-pie"></i> Report Analysis</h2>
                <div id="statusMessage" style="display: none;"></div>
                
                <div class="analysis-controls">
                    <div class="form-group">
                        <label for="employeeSelect"><i class="fas fa-user"></i> Select Employee:</label>
                        <select id="employeeSelect" class="form-control">
                            <option value="">-- Select Employee --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="reportSelect"><i class="fas fa-file-alt"></i> Select Report:</label>
                        <select id="reportSelect" class="form-control">
                            <option value="">-- First Select Employee --</option>
                        </select>
                    </div>
                    <button id="analyzeButton" class="button primary-button" disabled><i class="fas fa-cogs"></i> Analyze Report</button>
                </div>
                
                <div id="loadingIndicator" class="loading" style="display: none;">
                    <div class="spinner"></div>
                    <p>Analyzing report... This may take a moment.</p>
                </div>
            </section>
            
            <section id="analysisResults" class="card" style="display: none;">
                <!-- Analysis results will be dynamically inserted here -->
            </section>
        </main>
        
        <footer>
            <p>&copy; 2025 Employee Evaluation System</p>
        </footer>
    </div>
    
    <script src="../js/api.js"></script>
    <script src="../js/dropdown.js"></script>  <!-- Changed from searchable-dropdown.js -->
    <script src="../js/analysis.js"></script>
</body>
</html>
