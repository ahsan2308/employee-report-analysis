<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Employees - Employee Evaluation System</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-users"></i> Employee Evaluation System</h1>
            <nav>
                <ul>
                    <li><a href="../index.html"><i class="fas fa-home"></i> Home</a></li>
                    <li><a href="employees.html" class="active"><i class="fas fa-users"></i> Employees</a></li>
                    <li><a href="reports.html"><i class="fas fa-file-alt"></i> Reports</a></li>
                    <li><a href="analysis.html"><i class="fas fa-brain"></i> Analysis</a></li>
                    <li><a href="visualizations.html"><i class="fas fa-chart-bar"></i> Visualizations</a></li>
                </ul>
            </nav>
        </header>
        
        <main>
            <section class="card">
                <h2><i class="fas fa-user-plus"></i> Add Employee</h2>
                <div id="statusMessage"></div>
                
                <form id="employeeForm">
                    <div class="form-group">
                        <label for="name"><i class="fas fa-user"></i> Employee Name:</label>
                        <input type="text" id="name" name="name" required placeholder="Full name">
                    </div>
                    
                    <div class="form-group">
                        <label for="wing"><i class="fas fa-building"></i> Wing/Department:</label>
                        <input type="text" id="wing" name="wing" required placeholder="Department name">
                    </div>
                    
                    <div class="form-group">
                        <label for="position"><i class="fas fa-briefcase"></i> Position:</label>
                        <input type="text" id="position" name="position" required placeholder="Job title">
                    </div>
                    
                    <button type="submit" class="button primary-button"><i class="fas fa-plus-circle"></i> Add Employee</button>
                </form>
            </section>
            
            <section class="card">
                <h3><i class="fas fa-list"></i> Employee List</h3>
                <div id="loadingEmployees" class="loading">
                    <div class="spinner"></div>
                    <p>Loading employees...</p>
                </div>
                <div id="employeeList">
                    <table id="employeesTable" style="display: none;">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Wing/Department</th>
                                <th>Position</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Employee data will be inserted here -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
        
        <footer>
            <p>&copy; 2025 Employee Evaluation System</p>
        </footer>
    </div>
    
    <script src="../js/api.js"></script>
    <script src="../js/employees.js"></script>
</body>
</html>
