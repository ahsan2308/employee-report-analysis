<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Employees - Employee Evaluation System</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Employee Evaluation System</h1>
            <nav>
                <ul>
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="employees.html" class="active">Employees</a></li>
                    <li><a href="reports.html">Reports</a></li>
                    <li><a href="analysis.html">Analysis</a></li>
                    <li><a href="visualizations.html">Visualizations</a></li>
                </ul>
            </nav>
        </header>
        
        <main>
            <section>
                <h2>Manage Employees</h2>
                <div id="statusMessage"></div>
                
                <form id="employeeForm">
                    <div class="form-group">
                        <label for="name">Employee Name:</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="wing">Wing/Department:</label>
                        <input type="text" id="wing" name="wing" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="position">Position:</label>
                        <input type="text" id="position" name="position" required>
                    </div>
                    
                    <button type="submit" class="button">Add Employee</button>
                </form>
            </section>
            
            <section>
                <h3>Employee List</h3>
                <div id="loadingEmployees" class="loading">Loading employees...</div>
                <div id="employeeList">
                    <table id="employeesTable" style="display: none;">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Wing/Department</th>
                                <th>Position</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Employee data will be inserted here -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
        
        <footer>
            <p>&copy; 2025 Employee Evaluation System</p>
        </footer>
    </div>
    
    <script src="../js/api.js"></script>
    <script src="../js/employees.js"></script>
</body>
</html>
