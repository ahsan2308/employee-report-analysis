database:
  user: myuser
  password: mypassword
  host: localhost
  port: 5432
  name: employee_reports
  url: postgresql://myuser:mypassword@localhost:5432/employee_reports

llm:
  provider: ollama  # Options: ollama
  api_url: http://localhost:11434/api/generate
  model: llama3.1:8b

app:
  debug: true

vector_db:
  host: localhost  # Change to 'qdrant' if running in Docker
  port: 6333
  storage_path: ./qdrant_data  # Change to '/qdrant/storage' in Docker
  collection_name: employee_reports  # Collection name for storing vectors

  # Search parameters
  search:
    hnsw_ef: 128  # Controls search depth (higher = more accurate but slower)

  batch_processing:
    enabled: true
    embedding_batch_size: 50     # Maximum number of chunks to embed in one call
    upsert_batch_size: 100       # Maximum number of vectors to upsert in one call
    retry:
      max_attempts: 3            # Maximum number of retry attempts for failed batches
      backoff_factor: 2          # Multiplicative factor for successive backoff delays
      initial_wait_ms: 100       # Initial wait time before first retry (milliseconds)
    
    # Advanced settings (optional)
    split_on_failure: true       # Whether to split batches and retry on failure
    min_batch_size: 10           # Minimum batch size when splitting on failure

redis:
  host: localhost  # Change from redis-container to localhost if not using Docker
  port: 6379
  db: 0
  password: ""  # Empty for dev, set real password in production

celery:
  broker_url: redis://localhost:6379/0  # Change from redis-container to localhost if not using Docker
  result_backend: redis://localhost:6379/0
  task_serializer: json
  accept_content: [json]
  result_serializer: json
  task_track_started: true
  task_time_limit: 1800  # Hard limit: the worker process is killed after 30 minutes
  task_soft_time_limit: 1740  # Raised inside the task first, so it can record the failure
  worker_concurrency: 2  # Start with lower concurrency for LLM tasks
  task_ignore_result: false  # Store task results in backend
  result_expires: 86400  # Results expire after 1 day (in seconds)
  task_packages: ['app.tasks']  # Directories to auto-discover tasks
