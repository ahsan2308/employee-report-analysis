[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live and not sqlserver' --strict-markers --import-mode=importlib -p no:cacheprovider"
timeout = 120
markers = [
    "integration: needs a disposable Postgres database (set TEST_DATABASE_URL); applied automatically under tests/integration/",
    "live: needs a running Ollama, Redis or API server; deselected by default",
    "sqlserver: needs a SQL Server ODBC driver or a reachable SQL Server; deselected by default",
    "known_bug(id): characterizes a catalogued bug (see tests/KNOWN_BUGS.md); kept as-is until its fix is approved",
]

[tool.ruff]
extend-exclude = ["scripts/manual", "migrations/versions"]

[tool.ruff.lint]
# Deliberately narrow: unused imports and undefined names only. No reformatting.
select = ["F401", "F821"]
